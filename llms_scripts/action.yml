name: "LLMS Doc Generator"
description: "Generate documentation for LLMs with fallback config and output dir setup"

inputs: 
  docs_path:
    description: "Path to the directory where output will be saved"
    required: true

  config_path:
    description: "Path to the configuration file"
    required: false
    default: ""

  variables_yml_path:
    description: "Path to the variables.yml file in the client repo"
    required: true

runs:
  using: "composite"
  steps:
    - name: Check and resolve config path
      shell: bash
      run: |
        echo "Checking config path..."

        CONFIG_PATH="${{ inputs.config_path }}"

        # If the config path is not provided, fall back to the default location
        if [[ -z "$CONFIG_PATH" ]]; then
          echo "No config path provided. Falling back to default."
          CONFIG_PATH="${{ github.action_path }}/llms_config.json"
        fi

        # Resolve relative to workspace if necessary
        if [[ "$CONFIG_PATH" != /* ]]; then
          CONFIG_PATH="${GITHUB_WORKSPACE}/${CONFIG_PATH}"
        fi

        # Check if the config file exists
        if [[ ! -f "$CONFIG_PATH" ]]; then
          echo "Config file not found at: $CONFIG_PATH"
          echo "Falling back to default config in action directory."
          CONFIG_PATH="${{ github.action_path }}/llms_config.json"
        fi

        echo "Using config: $CONFIG_PATH"

        # Save the resolved config path to a temp file for use in next steps
        echo "CONFIG_PATH=$CONFIG_PATH" >> $GITHUB_ENV

    - name: Check and resolve variables.yml path
      shell: bash
      run: |
        echo "Checking variables.yml path..."

        # Use the specific path where the kluster-mkdocs repo is checked out
        VARIABLES_YML_PATH="${{ inputs.variables_yml_path }}"

        # Combine the `kluster-mkdocs` directory path with the provided variables.yml path
        if [[ "$VARIABLES_YML_PATH" != /* ]]; then
          VARIABLES_YML_PATH="${GITHUB_WORKSPACE}/kluster-mkdocs/${VARIABLES_YML_PATH}"
        fi

        # Check if the variables.yml file exists
        if [[ ! -f "$VARIABLES_YML_PATH" ]]; then
          echo "variables.yml file not found at: $VARIABLES_YML_PATH"
          echo "Exiting..."
          exit 1
        fi

        echo "Using variables.yml: $VARIABLES_YML_PATH"

        # Save the resolved path to a temp file for use in next steps
        echo "VARIABLES_YML_PATH=$VARIABLES_YML_PATH" >> $GITHUB_ENV

    - name: Run LLMS Generator
      shell: bash
      run: |
        echo "Running LLMS Generator..."
        python3 "${{ github.action_path }}/generate_llms.py" \
          --docs_path "${{ inputs.docs_path }}" \
          --config_path "$CONFIG_PATH" \
          --variables_yml_path "$VARIABLES_YML_PATH"

    - name: Upload LLMS Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llms-files
        path: |
          ${{ inputs.docs_path }}/llms-full.txt
          ${{ inputs.docs_path }}/llms.txt
          ${{ inputs.docs_path }}/llms-files/
