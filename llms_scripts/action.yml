name: "LLMS Doc Generator"
description: "Generate documentation for LLMs with fallback config and output dir setup"

inputs: 
  docs_path:
    description: "Path to the directory where output will be saved"
    required: true

  config_path:
    description: "Path to the configuration file"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Check and resolve config path
      shell: bash
      run: |
        echo "Checking config path..."

        CONFIG_PATH="${{ inputs.config_path }}"

        # Resolve relative to workspace
        if [[ "$CONFIG_PATH" != /* ]]; then
          CONFIG_PATH="${GITHUB_WORKSPACE}/${CONFIG_PATH}"
        fi

        if [[ ! -f "$CONFIG_PATH" ]]; then
          echo " Config file not found at: $CONFIG_PATH"
          echo " Falling back to default config in action directory."
          CONFIG_PATH="${{ github.action_path }}/llms_config.json"
        fi

        echo " Using config: $CONFIG_PATH"

        # Save resolved path to a temp file for use in next step
        echo "CONFIG_PATH=$CONFIG_PATH" >> $GITHUB_ENV

    - name: Run LLMS Generator
      shell: bash
      run: |
        echo "Running LLMS Generator..."
        python3 "${{ github.action_path }}/generate_llms.py" \
          --docs_path "${{ inputs.docs_path }}" \
          --config_path "$CONFIG_PATH"

    - name: Upload LLMS Output Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llms-files
        path: |
          ${{ inputs.docs_path }}/llms-full.txt
          ${{ inputs.docs_path }}/llms.txt
          ${{ inputs.docs_path }}/llms-files/
