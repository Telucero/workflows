name: Deploy Docs (Reusable)

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      repository:
        required: true
        type: string
      path:
        required: true
        type: string
      url_prefix:
        required: true
        type: string
      submodules:
        required: false
        type: boolean
        default: false
      docs_url:
        required: false
        type: string
      rewrite_image_paths:
        required: false
        type: boolean
        default: false
      deploy:
        required: false
        type: boolean
        default: false

    secrets:
      REPO_SCOPED_TOKEN:
        required: false  # ✅ Makes the secret optional for flexibility

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.submodules }}
          fetch-depth: 0
          token: ${{ secrets.REPO_SCOPED_TOKEN || github.token }}  # ✅ Use token if provided, fallback to default

      - name: Configure Git Creds
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Checkout target docs repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.branch }}
          path: ${{ inputs.path }}
          token: ${{ secrets.REPO_SCOPED_TOKEN || github.token }}  # ✅ Optional token again

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Cache MkDocs Material
        run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev build-essential

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip setuptools 'cython<3.0.0' wheel
          python -m pip install -r requirements.txt

      - name: Rewrite image and link paths (if enabled)
        if: ${{ inputs.rewrite_image_paths }}
        run: |
          find ${{ inputs.path }} -type f -name "*.md" -exec sed -i \
            -e "s|](/|](/${{ inputs.url_prefix }}/|g" \
            -e "s|href=\"/|href=\"/${{ inputs.url_prefix }}/|g" {} \;
          find . -type f -exec sed -i 's|/assets|assets|g' {} +

      - name: Deploy Docs with MkDocs (if deploy flag is set)
        if: ${{ inputs.deploy }}
        run: mkdocs gh-deploy --force --clean --site-dir ./site

      - name: Build Docs with MkDocs (if deploy flag is not set)
        if: ${{ inputs.deploy == false }}
        run: mkdocs build
