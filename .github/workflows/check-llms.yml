name: Validate Generated File

on:
  workflow_call:
    inputs:
      file_path:
        required: true
        type: string
        description: "Path to the file to validate (e.g. llms-full.txt)"
      generate_script:
        required: true
        type: string
        description: "Script to run to regenerate the file"
      working_directory:
        required: false
        type: string
        default: "."
        description: "Directory where the generate script should be run"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests beautifulsoup4

      - name: Get SHA256 hash of the PR file
        id: pr_hash
        run: |
          if [ -f "${{ inputs.file_path }}" ]; then
            sha256sum "${{ inputs.file_path }}" | awk '{ print $1 }' > pr_sha256.txt
          else
            echo "0000" > pr_sha256.txt
          fi

      - name: Run generate script
        run: |
          cd "${{ inputs.working_directory }}"
          python3 "${{ inputs.generate_script }}"

      - name: Get SHA256 hash of the regenerated file
        id: gen_hash
        run: |
          if [ -f "${{ inputs.file_path }}" ]; then
            sha256sum "${{ inputs.file_path }}" | awk '{ print $1 }' > generated_sha256.txt
          else
            echo "Error: ${!! inputs.file_path} not found after running generation script."
            exit 1
          fi

      - name: Compare SHA256 hashes
        run: |
          gen_hash=$(cat generated_sha256.txt)
          pr_hash=$(cat pr_sha256.txt)

          if [ "$gen_hash" != "$pr_hash" ]; then
            echo "Hash mismatch. Please run the generation script locally and commit the changes:"
            echo "    python3 ${{ inputs.generate_script }}"
            exit 1
          else
            echo "Hashes match. File is valid."
          fi
